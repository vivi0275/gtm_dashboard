<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tandem — Outbound Dashboard</title>
<style>
:root { color-scheme: light; }
* { box-sizing: border-box; }
body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #f7f8fa; color: #1a1d24; font-size: 14px; line-height: 1.5; }
.wrap { max-width: 1080px; margin: 0 auto; padding: 24px 20px 70px; }
h1 { font-size: 20px; margin: 0 0 2px; }
.sub { color: #6b7280; font-size: 13px; }
.meta { color: #9ca3af; font-size: 12px; margin: 4px 0 18px; }
.section-title { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: #6b7280; margin: 30px 0 12px; }
.section-title span { text-transform: none; letter-spacing: 0; font-weight: 500; color: #b6bcc6; margin-left: 8px; }
.hr { height: 1px; background: #e6e8ec; border: 0; margin: 34px 0 0; }
.card { background: #fff; border: 1px solid #e6e8ec; border-radius: 12px; padding: 18px; }
.stars { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.star { background: #fff; border: 1px solid #e6e8ec; border-radius: 12px; padding: 16px; }
.star.hero { background: linear-gradient(135deg,#111827,#1f2937); border: none; color: #fff; }
.star .v { font-size: 30px; font-weight: 800; letter-spacing: -.02em; }
.star .l { font-size: 12px; margin-top: 2px; opacity: .85; }
.star .d { font-size: 12px; margin-top: 5px; font-weight: 600; color: #6b7280; }
.funnel { display: flex; flex-direction: column; gap: 8px; }
.frow { display: grid; grid-template-columns: 175px 1fr; gap: 14px; align-items: center; }
.flabel .fname { font-weight: 600; font-size: 13px; }
.flabel .fconv { color: #9ca3af; font-size: 11px; }
.fbarwrap { background: #eef0f3; border-radius: 8px; height: 32px; overflow: hidden; }
.fbar { height: 100%; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 13px; white-space: nowrap; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: right; padding: 9px 10px; border-bottom: 1px solid #eef0f3; vertical-align: top; }
th:first-child, td:first-child { text-align: left; }
th { color: #6b7280; font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
td.step { font-weight: 600; }
.msg { color: #6b7280; font-size: 12px; font-style: italic; max-width: 380px; }
.pill { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 20px; white-space: nowrap; }
.pill.live { background: #dcfce7; color: #15803d; }
.pill.draft { background: #f3f4f6; color: #6b7280; }
.note { font-size: 12px; color: #9ca3af; margin-top: 10px; }
.err { background: #fef2f2; border: 1px solid #fecaca; color: #b91c1c; padding: 12px 14px; border-radius: 10px; }
.loading { color: #9ca3af; padding: 40px; text-align: center; }
.exgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); gap: 12px; }
.excard { background: #fff; border: 1px solid #e6e8ec; border-radius: 12px; padding: 16px; }
.excard .exname { font-weight: 700; font-size: 14px; }
.excard .exsig { color: #6b7280; font-size: 12px; margin: 2px 0 12px; }
.exkpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.exkpi { background: #f7f8fa; border-radius: 8px; padding: 8px 10px; }
.exkpi .v { font-size: 18px; font-weight: 700; }
.exkpi .l { font-size: 11px; color: #6b7280; }
.exempty { color: #9ca3af; font-size: 13px; padding: 10px 0; }
.rebtn { float: right; font-size: 12px; color: #4f46e5; cursor: pointer; text-decoration: none; }
.filterbar { display: flex; flex-wrap: wrap; gap: 14px; margin: 22px 0 32px; }

/* Filter buttons — from Uiverse.io by adamgiebl */
.button {
  font-size: 15px;
  border-radius: 12px;
  background: linear-gradient(180deg, rgb(56, 56, 56) 0%, rgb(36, 36, 36) 66%, rgb(41, 41, 41) 100%);
  color: rgb(150, 150, 150);
  border: none;
  padding: 2px;
  font-weight: 700;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transition: color 0.3s, background 0.3s;
}
.button span {
  border-radius: 10px;
  padding: 0.7em 1.25em;
  text-shadow: 0px 0px 20px #4b4b4b;
  width: 100%;
  display: flex;
  align-items: center;
  gap: 12px;
  color: inherit;
  transition: all 0.3s;
  background-color: rgb(29, 29, 29);
  background-image: radial-gradient(at 95% 89%, rgb(15, 15, 15) 0px, transparent 50%), radial-gradient(at 0% 100%, rgb(17, 17, 17) 0px, transparent 50%), radial-gradient(at 0% 0%, rgb(29, 29, 29) 0px, transparent 50%);
}
.button:hover { color: rgb(205, 205, 205); }
.button:hover span { background-color: rgb(26, 25, 25); }
.button.active { color: #fff; background: linear-gradient(180deg, rgb(120, 120, 120) 0%, rgb(74, 74, 74) 100%); }
.button.active span { box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08); }
.button-overlay {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: repeating-conic-gradient(rgb(48, 47, 47) 0.0000001%, rgb(51, 51, 51) 0.000104%) 60% 60%/600% 600%;
  filter: opacity(10%) contrast(105%);
  -webkit-filter: opacity(10%) contrast(105%);
}
.button svg { width: 15px; height: 15px; }
.qpills { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
.sig { font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 20px; white-space: nowrap; display: inline-block; }
.sig.pos { background: #dcfce7; color: #15803d; }
.sig.warm { background: #fef3c7; color: #b45309; }
.sig.cold { background: #fee2e2; color: #b91c1c; }
.tag { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 20px; background: #dcfce7; color: #15803d; margin-left: 8px; vertical-align: middle; text-transform: none; letter-spacing: 0; }
.steptype { font-size: 11px; font-weight: 700; padding: 2px 10px; border-radius: 6px; background: #eef2ff; color: #4f46e5; }
tr.muted td { color: #b6bcc6; }
td.center, th.center { text-align: center; }
.subhead td { padding-top: 20px; color: #6b7280; font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; border-bottom: 1px solid #eef0f3; }
</style>
</head>
<body>
<div class="wrap">
  <a class="rebtn" href="#" onclick="location.reload();return false;">↻ Refresh</a>
  <h1>🏹 Tandem — Outbound Dashboard</h1>
  <div class="sub">LinkedIn outbound · Campaign GTM + this quarter's experiments · live from lemlist</div>
  <div class="meta" id="meta">Loading…</div>
  <div id="filterbar"></div>
  <div id="root"><div class="loading">Fetching campaign data…</div></div>
</div>
<script>
function pct(n, d) { return d > 0 ? Math.round(n / d * 1000) / 10 : 0; }
function fmtPct(n, d) { return d > 0 ? pct(n, d).toFixed(1) + "%" : "—"; }

var DATA = null;       // the full payload from /api/stats
var SELECTED = "all";  // "all" or a campaign id

async function load() {
  let data;
  try {
    const r = await fetch("/api/stats");
    data = await r.json();
    if (data.error) throw new Error(data.error);
  } catch (e) {
    document.getElementById("root").innerHTML = '<div class="err">Could not load data: ' + (e.message || e) + '</div>';
    document.getElementById("meta").textContent = "";
    return;
  }
  DATA = data;
  const camps = data.campaigns || [];
  const main = camps.find(function (c) { return c.role === "main"; });
  SELECTED = main ? main.id : "all";  // land on the main campaign by default

  const when = data.generatedAt ? new Date(data.generatedAt).toLocaleString() : "";
  document.getElementById("meta").textContent = "Live from lemlist · last refreshed " + when + " · cached ~15 min";

  renderFilterBar();
  renderContent();
}

// --- Filter bar --------------------------------------------------------------
function renderFilterBar() {
  const camps = (DATA && DATA.campaigns) || [];
  function btn(id, label) {
    return '<button class="button' + (SELECTED === id ? " active" : "") +
      '" onclick="selectFilter(\'' + id + '\')"><span>' + label + '</span><div class="button-overlay"></div></button>';
  }
  let html = btn("all", "All campaigns");
  html += camps.map(function (c) { return btn(c.id, c.name); }).join("");
  document.getElementById("filterbar").innerHTML = html;
}

function selectFilter(id) {
  SELECTED = id;
  renderFilterBar();
  renderContent();
  window.scrollTo({ top: 0, behavior: "smooth" });
}
window.selectFilter = selectFilter;

// --- Content rendering -------------------------------------------------------
function renderContent() {
  const camps = (DATA && DATA.campaigns) || [];
  if (SELECTED === "all") {
    document.getElementById("root").innerHTML = allView(camps);
  } else {
    const c = camps.find(function (x) { return x.id === SELECTED; });
    document.getElementById("root").innerHTML = c ? campaignDetail(c) : '<div class="err">Campaign not found.</div>';
  }
}

function star(v, l, cls, d) {
  return '<div class="star ' + (cls || "") + '"><div class="v">' + v + '</div><div class="l">' + l + '</div>' + (d ? '<div class="d">' + d + '</div>' : '') + '</div>';
}

function toneClass(t) { return t === "positive" ? "pos" : (t === "warm" ? "warm" : "cold"); }

// Funnel bars for a campaign; inserts a "Positive reply" stage when curated.
function funnelHtml(c) {
  const cur = c.curated;
  const positive = (cur && cur.replyQuality) ? cur.replyQuality.rows.filter(function (r) { return r.tone === "positive"; }).length : null;
  const stages = [
    { name: "Contacted (invited)", v: c.contacted, color: "#4338ca" },
    { name: "Invite accepted", v: c.accepted, color: "#7c3aed", prev: c.contacted },
    { name: "Replied", v: c.replied, color: "#ea580c", prev: c.accepted }
  ];
  if (positive != null) stages.push({ name: "Positive reply", v: positive, color: "#d97706", prev: c.replied });
  stages.push({ name: "Meeting booked", v: c.booked, color: "#16a34a", prev: positive != null ? positive : c.replied });

  const maxV = c.contacted || 1;
  return '<div class="card"><div class="funnel">' + stages.map(function (s) {
    const w = Math.max((s.v / maxV) * 100, s.v > 0 ? 6 : 1.5);
    const conv = s.prev != null ? " · " + fmtPct(s.v, s.prev) + " from prev" : "";
    return '<div class="frow"><div class="flabel"><div class="fname">' + s.name + '</div><div class="fconv">' +
      fmtPct(s.v, c.contacted) + " of contacted" + conv + '</div></div><div class="fbarwrap"><div class="fbar" style="width:' +
      w + '%;background:' + s.color + '">' + s.v + '</div></div></div>';
  }).join("") + '</div></div>';
}

// Curated reply-quality table (sentiment). Falls back to live replies list.
function replyQualityHtml(c) {
  const cur = c.curated;
  if (!cur || !cur.replyQuality) {
    // No curated analysis — show the live repliers list.
    if (!c.replies || !c.replies.length) return '<div class="section-title">Recent replies</div><div class="card exempty">No replies yet.</div>';
    const body = c.replies.map(function (r) {
      const d = r.date ? new Date(r.date).toLocaleDateString() : "";
      return '<tr><td class="step">' + r.name + (r.company ? ' <span style="color:#9ca3af;font-weight:400">· ' + r.company + '</span>' : '') +
        '</td><td class="msg">' + (r.preview || "") + '</td><td>' + d + '</td></tr>';
    }).join("");
    return '<div class="section-title">Recent replies</div><div class="card"><table><thead><tr><th>Who replied</th><th>What they said</th><th>When</th></tr></thead><tbody>' + body + '</tbody></table></div>';
  }
  const rq = cur.replyQuality;
  const pos = rq.rows.filter(function (r) { return r.tone === "positive"; }).length;
  const warm = rq.rows.filter(function (r) { return r.tone === "warm"; }).length;
  const cold = rq.rows.filter(function (r) { return r.tone === "cold"; }).length;
  const pills = '<div class="qpills"><span class="sig pos">' + pos + ' positive</span>' +
    '<span class="sig warm">' + warm + ' engaged / lukewarm</span>' +
    '<span class="sig cold">' + cold + ' not a fit</span></div>';
  const body = rq.rows.map(function (r) {
    return '<tr><td class="step">' + r.name + (r.company ? ' <span style="color:#9ca3af;font-weight:400">· ' + r.company + '</span>' : '') +
      '</td><td>' + (r.title || "") + '</td><td class="msg">' + (r.read || "") +
      '</td><td><span class="sig ' + toneClass(r.tone) + '">' + r.signal + '</span></td></tr>';
  }).join("");
  const note = rq.note ? '<div class="note">' + rq.note + '</div>' : "";
  return '<div class="section-title">Reply quality' + (rq.asOf ? ' <span>' + rq.asOf + '</span>' : '') + '</div>' +
    '<div class="card">' + pills + '<table><thead><tr><th>Who replied</th><th>Title</th><th>Read</th><th>Signal</th></tr></thead><tbody>' +
    body + '</tbody></table>' + note + '</div>';
}

function perStepHtml(c) {
  const cur = c.curated;
  if (!cur || !cur.perStep || !cur.perStep.length) return "";
  const body = cur.perStep.map(function (s) {
    const muted = s.sent === 0;
    return '<tr' + (muted ? ' class="muted"' : '') + '><td class="step">' + s.step +
      '</td><td class="center"><span class="steptype">' + s.type + '</span></td><td>' + s.sent +
      '</td><td>' + s.replied + '</td><td>' + (s.sent > 0 ? fmtPct(s.replied, s.sent) : "—") + '</td></tr>';
  }).join("");
  return '<div class="section-title">Per-step message performance</div>' +
    '<div class="card"><table><thead><tr><th>Step</th><th class="center">Type</th><th>Sent</th><th>Replied</th><th>Reply %</th></tr></thead><tbody>' +
    body + '</tbody></table></div>';
}

function byJobTitleHtml(c) {
  const cur = c.curated;
  if (!cur || !cur.byJobTitle) return "";
  const b = cur.byJobTitle;
  function row(x) {
    const tag = x.tag ? ' <span class="tag">' + x.tag + '</span>' : '';
    return '<tr><td class="step">' + x.name + tag + '</td><td>' + x.contacted +
      '</td><td>' + x.accepted + ' <span style="color:#9ca3af">(' + fmtPct(x.accepted, x.contacted) + ')</span></td><td>' +
      x.replied + ' <span style="color:#9ca3af">(' + fmtPct(x.replied, x.contacted) + ')</span></td></tr>';
  }
  const roles = (b.roles || []).map(row).join("");
  const sen = (b.seniority || []).map(row).join("");
  const senBlock = sen ? '<tr class="subhead"><td>Seniority</td><td></td><td></td><td></td></tr>' + sen : "";
  const footer = b.footer ? '<div class="note">' + b.footer + '</div>' : "";
  return '<div class="section-title">Response by job title' + (b.batchNote ? ' <span>' + b.batchNote + '</span>' : '') + '</div>' +
    '<div class="card"><table><thead><tr><th>Role family</th><th>Contacted</th><th>Accepted</th><th>Replied</th></tr></thead><tbody>' +
    roles + senBlock + '</tbody></table>' + footer + '</div>';
}

// Full detail view for a single campaign / experiment.
function campaignDetail(c) {
  const badge = c.live ? '<span class="pill live">Live</span>' : '<span class="pill draft">Draft</span>';
  const kind = c.role === "main" ? "Main campaign" : "Experiment";

  if (!c.live) {
    return '<div class="section-title">' + kind + ' <span>' + c.name + '</span></div>' +
      '<div class="card exempty">Not launched yet — no data for “' + c.name + '”.' +
      (c.signal ? ' <br><span style="color:#b6bcc6">' + c.signal + '</span>' : '') + '</div>';
  }

  const stars = '<div class="stars">' +
    star(c.booked, "Meetings booked", "hero", "") +
    star(c.accepted, "Invites accepted", "", fmtPct(c.accepted, c.contacted) + " accept rate") +
    star(c.replied, "Replies", "", fmtPct(c.replied, c.accepted) + " of accepted") +
    star(c.contacted, "Contacted", "", "") +
    '</div>';

  return '<div class="section-title">' + kind + ' <span>' + c.name + '</span> ' + badge + '</div>' +
    (c.signal ? '<div class="meta">' + c.signal + '</div>' : '') + stars +
    '<div class="section-title">Funnel</div>' + funnelHtml(c) +
    replyQualityHtml(c) +
    perStepHtml(c) +
    byJobTitleHtml(c);
}

// Aggregated view: every campaign's stats combined into one funnel,
// one reply-quality table, and one response-by-job-title breakdown.
function allView(camps) {
  const agg = { name: "All campaigns", contacted: 0, accepted: 0, replied: 0, booked: 0 };
  camps.forEach(function (c) {
    agg.contacted += c.contacted; agg.accepted += c.accepted;
    agg.replied += c.replied; agg.booked += c.booked;
  });

  // Combine every campaign's curated reply-quality rows.
  const rqRows = [];
  camps.forEach(function (c) {
    if (c.curated && c.curated.replyQuality && c.curated.replyQuality.rows) {
      rqRows.push.apply(rqRows, c.curated.replyQuality.rows);
    }
  });

  // Merge response-by-job-title across campaigns, summing by row name.
  function mergeRows(getter) {
    const map = {}, order = [];
    camps.forEach(function (c) {
      const arr = (c.curated && c.curated.byJobTitle) ? (getter(c.curated.byJobTitle) || []) : [];
      arr.forEach(function (x) {
        if (!map[x.name]) { map[x.name] = { name: x.name, contacted: 0, accepted: 0, replied: 0, tag: x.tag }; order.push(x.name); }
        map[x.name].contacted += x.contacted; map[x.name].accepted += x.accepted; map[x.name].replied += x.replied;
        if (x.tag) map[x.name].tag = x.tag;
      });
    });
    return order.map(function (n) { return map[n]; });
  }
  const roles = mergeRows(function (b) { return b.roles; });
  const seniority = mergeRows(function (b) { return b.seniority; });

  // Synthetic campaign object so the section renderers can be reused.
  agg.curated = {
    replyQuality: rqRows.length ? { rows: rqRows } : null,
    byJobTitle: (roles.length || seniority.length) ? { roles: roles, seniority: seniority, batchNote: "all campaigns combined" } : null
  };

  const stars = '<div class="stars">' +
    star(agg.booked, "Meetings booked", "hero", "") +
    star(agg.accepted, "Invites accepted", "", fmtPct(agg.accepted, agg.contacted) + " accept rate") +
    star(agg.replied, "Replies", "", fmtPct(agg.replied, agg.accepted) + " of accepted") +
    star(agg.contacted, "Contacted", "", "") +
    '</div>';

  return '<div class="section-title">All campaigns <span>combined across every campaign</span></div>' + stars +
    '<div class="section-title">Funnel <span>all campaigns combined</span></div>' + funnelHtml(agg) +
    replyQualityHtml(agg) +
    byJobTitleHtml(agg);
}

load();
</script>
</body>
</html>
